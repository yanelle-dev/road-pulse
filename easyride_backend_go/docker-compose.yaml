services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: easyride_db
    ports:
      - '5432:5432'
    volumes:
      - postgis_go_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/easyride_db
      - PORT=8000
      - OSRM_BASE=https://router.project-osrm.org
      - JWT_SECRET=road_pulse_secret_key_prod_2026
    ports:
      # Внешний порт 8001 на сервере пробрасывается на 8000 в контейнере
      - '8001:8000'
    depends_on:
      - db

volumes:
  postgis_go_data:
