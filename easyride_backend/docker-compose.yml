services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: easyride_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/easyride_db
    ports:
      # Внешний порт 8001 на хосте мапится на внутренний 8000 контейнера
      - "8001:8000"
    depends_on:
      - db

volumes:
  postgis_data: