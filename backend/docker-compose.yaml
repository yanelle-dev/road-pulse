services:
  db:
    image: postgis/postgis:15-3.3
    container_name: road_pulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Необходимо задать POSTGRES_PASSWORD в файле .env}
      POSTGRES_DB: ${POSTGRES_DB:-road_pulse_db}
    ports:
      # Только для локальной разработки (go run на хосте); наружу порт не открываем.
      - '127.0.0.1:5432:5432'
    volumes:
      - road_pulse_data:/var/lib/postgresql/data
    networks:
      - road_pulse_net

  api:
    build: .
    container_name: road_pulse_api
    restart: always
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:?Необходимо задать DATABASE_URL в файле .env}
      - PORT=${PORT:-8000}
      - OSRM_BASE=${OSRM_BASE:-https://router.project-osrm.org}
      - JWT_SECRET=${JWT_SECRET:?Необходимо задать JWT_SECRET в файле .env}
      - SMS_GATE_URL=${SMS_GATE_URL:-}
      - SMS_GATE_USER=${SMS_GATE_USER:-}
      - SMS_GATE_PASSWORD=${SMS_GATE_PASSWORD:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    ports:
      - '8001:8000'
    depends_on:
      - db
    networks:
      - road_pulse_net

volumes:
  road_pulse_data:

networks:
  road_pulse_net:
    driver: bridge